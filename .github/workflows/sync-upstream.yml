name: Upstream Sync

permissions:
  contents: write
  actions: write

on:
  # This fork has diverged from upstream. Keep sync manual until the current
  # conflicts are reviewed so the same failure does not notify every day.
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      # Sync the fork's default branch with upstream using GitHub's native
      # merge-upstream API. Unlike third-party actions that push commits with
      # GITHUB_TOKEN, this performs an internal fast-forward and is NOT blocked
      # when upstream changes files under .github/workflows/.
      - name: Sync upstream changes
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          result="$(gh api -X POST "repos/${{ github.repository }}/merge-upstream" \
            -f branch=main --jq '.merge_type')"
          echo "merge_type=$result"
          echo "merge_type=$result" >> "$GITHUB_OUTPUT"

      - name: Trigger Worker deploy
        if: ${{ success() && steps.sync.outputs.merge_type != 'none' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-worker.yml --repo "${{ github.repository }}" --ref main

      - name: Sync check
        if: failure()
        run: |
          echo "[Error] 自动同步失败。如果上游与本仓库出现分叉（diverged），merge-upstream 无法快进，需要手动处理。"
          echo "[Error] Automatic sync failed. If the fork has diverged from upstream, merge-upstream cannot fast-forward and manual intervention is required."
          exit 1
